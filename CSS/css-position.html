<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .background{
        position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;


    }
.container{
    position: relative;
    box-sizing: border-box;
    position:fixed;
}
.topleft{
    position: absolute;
  top: 8px;
  left: 16px;
  font-size: 40px;
  color: blueviolet;
}
.topright{
 position: absolute;
  top: 8px;
  right: 16px;
  font-size: 40px;
  color: blueviolet;
}

.centered{
    position: absolute;
    top: 50%;
    width: 100%;
    text-align: center;
    font-size: 40px;
    color: blueviolet;
}
.bottomright{
    position: absolute;
    bottom: 8px;
    left: 16px;
    font-size: 40px;
    color: blueviolet;
}
.bottomleft{
    position: absolute;
    bottom: 8px;
    right: 16px;
    font-size: 40px;
    color: blueviolet;
}
</style>
<div class="container">
<img src="image.png" alt="place" class="background">
<div class="topleft">Kumar Gaurav</div>
<div class="topright">Kumar Gaurav</div>
<div class="centered">Kumar Gaurav</div>
<div class="bottomleft">Kumar Gaurav</div>
<div class="bottomright">Kumar Gaurav</div>
</div>
</body>
</html>
